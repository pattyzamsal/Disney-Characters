name: DisneyCharacters

options:
  bundleIdPrefix: com.disneycharacters.publicapp
  deploymentTarget:
    iOS: "26.2"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

# ─── SPM Packages ────────────────────────────────────────────────────────────

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    minorVersion: "8.9.0"
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    minorVersion: "1.19.2"

# ─── Build Configurations ────────────────────────────────────────────────────

configs:
  Debug: debug
  Release: release

# ─── Project-wide Settings ───────────────────────────────────────────────────

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_NO_COMMON_BLOCKS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      MTL_FAST_MATH: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      COPY_PHASE_STRIP: NO
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      MTL_FAST_MATH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
      VALIDATE_PRODUCT: YES

# ─── Targets ─────────────────────────────────────────────────────────────────

targets:

  DisneyCharacters:
    type: application
    platform: iOS
    sources:
      - path: DisneyCharacters
    configFiles:
      Debug: DisneyCharacters/Configuration/Dev.xcconfig
      Release: DisneyCharacters/Configuration/Prod.xcconfig
    info:
      path: Disney-Characters-Info.plist
      properties:
        API_BASE_URL: "$(API_BASE_URL)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.disneycharacters.publicapp.Disney-Characters"
        PRODUCT_NAME: "Disney Characters"
        PRODUCT_MODULE_NAME: DisneyCharacters
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: Kingfisher
    postBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --config "${SRCROOT}/../.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed. Run: brew install swiftlint"
          fi
        runForInstallBuildsOnly: false

  DisneyCharactersTests:
    type: bundle.unit-test
    platform: iOS
    sources: DisneyCharactersTests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.disneycharacters.publicapp.Disney-CharactersTests"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Disney Characters.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Disney Characters"
    dependencies:
      - target: DisneyCharacters
      - package: swift-snapshot-testing
        product: SnapshotTesting
      - package: swift-snapshot-testing
        product: InlineSnapshotTesting
      - package: swift-snapshot-testing
        product: SnapshotTestingCustomDump
    preBuildScripts:
      - name: Sourcery
        script: |
          if which sourcery > /dev/null; then
            sourcery \
              --sources "${SRCROOT}/DisneyCharacters" \
              --templates "${SRCROOT}/../Templates/AutoMockable.stencil" \
              --output "${SRCROOT}/DisneyCharactersTests/Mocks/Generated"
          else
            echo "warning: Sourcery not installed. Run: brew install sourcery"
          fi
        outputFiles:
          - "$(SRCROOT)/DisneyCharactersTests/Mocks/Generated/AutoMockable.generated.swift"
        runForInstallBuildsOnly: false

  DisneyCharactersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: DisneyCharactersUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.disneycharacters.publicapp.Disney-CharactersUITests"
        TEST_TARGET_NAME: DisneyCharacters
    dependencies:
      - target: DisneyCharacters

# ─── Schemes ─────────────────────────────────────────────────────────────────

schemes:

  Disney Characters:
    build:
      targets:
        DisneyCharacters: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DisneyCharactersTests
          parallelizable: true
        - name: DisneyCharactersUITests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  DisneyCharactersTests:
    build:
      targets:
        DisneyCharacters: [build]
        DisneyCharactersTests: [test, analyze]
    test:
      config: Debug
      testPlans:
        - path: TestPlans/UnitTests.xctestplan
          defaultPlan: true
        - path: TestPlans/SnapshotTests.xctestplan
        - path: TestPlans/AllTests.xctestplan

  DisneyCharactersUITests:
    build:
      targets:
        DisneyCharacters: [build]
        DisneyCharactersUITests: [test, analyze]
    test:
      config: Debug
      targets:
        - DisneyCharactersUITests
